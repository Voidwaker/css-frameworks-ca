<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="/dist/css/index.css">
    <script type="module" src="/js/index.mjs" defer></script>
    <script defer src="/node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-dark">
    <header>
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <div class="container-fluid">
                <a class="navbar-brand" href="/">Home</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link active" href="/profile/index.html">Profile</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/feed/index.html">Feed</a>
                        </li>
                        <li class="nav-item">
                            <button id="logoutBtn" class="btn btn-danger">Logout</button>
                        </li>                        
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <main class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="profile-picture d-flex justify-content-center mb-3">
                    <img id="profile-avatar" src="https://via.placeholder.com/150" class="img-fluid rounded-circle" alt="Profile picture">
                </div>
                <div class="text-center">
                    <p class="text-green h4" id="profile-username">@Username</p>
                </div>
                <div class="d-flex justify-content-center mt-2">
                    <p class="text-green me-3">Followers: <span id="profile-followers">0</span></p>
                    <p class="text-green">Following: <span id="profile-following">0</span></p>
                </div>
                <div class="text-center mt-4">
                    <h2 class="text-green">Bio</h2>
                    <p class="text-green" id="profile-bio">No bio available</p>
                </div>
            </div>
        </div>
        <div class="row justify-content-center mt-5">
            <div class="col-md-8">
                <h2 class="text-center text-green">My Posts</h2>
                <div id="user-posts" class="mt-4"></div>
            </div>
        </div>
        <div class="modal fade" id="editPostModal" tabindex="-1" aria-labelledby="editPostModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content bg-dark text-green">
                    <div class="modal-header">
                        <h5 class="modal-title" id="editPostModalLabel">Edit Post</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="editPostId">
                        <div class="mb-3">
                            <label for="editTitle" class="form-label text-green">Title</label>
                            <input type="text" class="form-control text-green bg-dark" id="editTitle">
                        </div>
                        <div class="mb-3">
                            <label for="editBody" class="form-label text-green">Body</label>
                            <textarea class="form-control text-green bg-dark" id="editBody"></textarea>
                        </div>
                        <div class="mb-3">
                            <label for="editMedia" class="form-label text-green">Media URL</label>
                            <input type="text" class="form-control text-green bg-dark" id="editMedia">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="button" class="btn btn-success" id="saveEdit">Save changes</button>
                    </div>
                </div>
            </div>
        </div>  
    </main>    
</body>
</html>
